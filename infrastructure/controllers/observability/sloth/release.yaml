apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sloth
  namespace: observability
spec:
  interval: 30m
  chart:
    spec:
      chart: sloth
      version: 0.16.0
      sourceRef:
        kind: HelmRepository
        name: sloth
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # no git-sync sidecar, our SLIs are plain queries
    commonPlugins:
      enabled: false
