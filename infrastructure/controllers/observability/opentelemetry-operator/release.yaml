apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-operator
  namespace: observability
spec:
  interval: 30m
  chart:
    spec:
      chart: opentelemetry-operator
      version: 0.125.0
      sourceRef:
        kind: HelmRepository
        name: opentelemetry-operator
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    manager:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    # self-signed webhook certs, no cert-manager needed
    admissionWebhooks:
      certManager:
        enabled: false
      autoGenerateCert:
        enabled: true
