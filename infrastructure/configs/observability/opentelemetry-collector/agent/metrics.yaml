# metrics: pull the apps' /metrics and take SDK pushes (exemplars), forward to the gateway
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-agent
  namespace: observability
spec:
  config:
    receivers:
      # the Target Allocator hands each agent its node's targets from this config
      prometheus:
        config:
          scrape_configs:
            - job_name: apps
              scrape_interval: 15s
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [ml-api, backend-api]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  regex: http
                  action: keep
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_label_app]
                  target_label: job

    processors:
      # move the pod label to the resource so k8s_attributes can match it
      transform/scrape_resource:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - set(resource.attributes["k8s.namespace.name"], datapoint.attributes["namespace"])
              - set(resource.attributes["k8s.pod.name"], datapoint.attributes["pod"])

    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, transform/scrape_resource, k8s_attributes, batch]
          exporters: [otlp_grpc/gateway]
        # SDK-pushed metrics (with exemplars) already carry the pod on the resource
        metrics/otlp:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, batch]
          exporters: [otlp_grpc/gateway]
