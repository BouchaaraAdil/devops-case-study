apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: backend-api
  labels:
    app: backend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-python: observability/python
      labels:
        app: backend-api
    spec:
      containers:
        - name: backend-api
          image: ghcr.io/voize-gmbh/devops-case-study/backend-api:v1
          # image CMD plus --log-config, so access logs reach OTel with trace context
          args: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--log-config", "/etc/uvicorn/log-config.json"]
          volumeMounts:
            - name: uvicorn-log-config
              mountPath: /etc/uvicorn
              readOnly: true
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DB_HOST
              value: "postgres.postgres.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "voize"
            - name: DB_USER
              value: "voize"
            - name: DB_PASSWORD
              value: "voize"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: uvicorn-log-config
          configMap:
            name: uvicorn-log-config
